name: Windows
on:
  push:
    branches: ["main"]
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write 
  issues: read
  packages: none
  
jobs:
  build-msix:
    runs-on: windows-latest # Use a Windows runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MSIX Packaging Tool
        run: |
           winget install --id Microsoft.MSIXPackagingTool -e --accept-source-agreements --accept-package-agreements --silent

      - name: Download 
        run: |
          $msixToolPath = ""
          try {
              $msixToolPath = (Get-Command msixPackagingTool.exe -ErrorAction Stop).Source
              Write-Host "MSIX Packaging Tool found at: $msixToolPath"
          } catch {
              throw "MSIX Packaging Tool not found in PATH. Please ensure it's installed correctly via winget."
          }
          
          curl -L "https://github.com/myridia/ct/releases/download/main/ct.exe" -o "./ct.exe"
          
          dir 
          
      - name: SKD
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v1.6 
        
      - name: Certificate 
        run: |
          $folder = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\"
          $currentPath = $env:Path
          $env:Path = "$folder;$currentPath"

   
          $certSubject = "CN=Myridia"
          $pfxFilePath = ".\Myridia.pfx"
          $pfxPassword = "YourSecurePasswordHere" # Change this!
          $storeLocation = "Cert:\CurrentUser\My"
          $cert = New-SelfSignedCertificate -Subject $certSubject -CertStoreLocation $storeLocation -KeyExportPolicy Exportable -KeyUsage DigitalSignature -FriendlyName "Myridia Certificate"
          if ($cert) { Export-PfxCertificate -Cert $cert.Thumbprint -FilePath $pfxFilePath -Password $pfxPassword -Force; Write-Host "PFX certificate created at $pfxFilePath" } else { Write-Error "Certificate generation failed." }

          
          # makecert -r -pe -n "CN=Myridia" -ss CA -a sha256 -cy authority -sky signature -sv Myridia.pvk Myridia.cer
          # certutil -user -addstore Root Myridia.cer
          # makecert -pe -n "CN=Ct SPC" -a sha256 -cy end -sky signature -ic Myridia.cer -iv Myridia.pvk -sv Ct.pvk Ct.cer
          # pvk2pfx -pvk Ct.pvk -spc Ct.cer -pfx Ct.pfx
          dir 
          # signtool sign /v /f Ct.pfx /t http://timestamp.digicert.com /fd sha256 ct.exe
          # signtool verify /pa "ct.exe"
          


       

 
