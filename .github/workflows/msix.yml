name: Windows
on:
  push:
    branches: ["main"]
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write 
  issues: read
  packages: none
  
jobs:
  build-msix:
    runs-on: windows-latest # Use a Windows runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MSIX Packaging Tool
        run: |
           winget install --id Microsoft.MSIXPackagingTool -e --accept-source-agreements --accept-package-agreements --silent

      - name: Create
        run: |
          $msixToolPath = ""
          try {
              $msixToolPath = (Get-Command msixPackagingTool.exe -ErrorAction Stop).Source
              Write-Host "MSIX Packaging Tool found at: $msixToolPath"
          } catch {
              throw "MSIX Packaging Tool not found in PATH. Please ensure it's installed correctly via winget."
          }
          curl -L "https://github.com/myridia/ct/releases/download/main/ct.exe" -o "./ct.exe"
          dir 


       

 
