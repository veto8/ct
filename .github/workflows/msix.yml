      - name: Certificate 
        run: |
          # $folder = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\"
          # $currentPath = $env:Path
          # $env:Path = "$folder;$currentPath"

          $cert = "CN=Myridia"
          $pfx = ".\Myridia.pfx"
          $ppass = "passpass" 
          $pass = ConvertTo-SecureString $ppass -AsPlainText -Force

          $loc = "Cert:\CurrentUser\My"

          $cert = New-SelfSignedCertificate -Subject $cert -CertStoreLocation $loc -KeyExportPolicy Exportable -KeyUsage DigitalSignature -FriendlyName "Myridia Certificate"
          
          if ($cert) {
            Export-PfxCertificate -Cert $cert.Thumbprint -FilePath $pfx -Password $pass -Force

            Write-Host "PFX certificate created at $pfx"
          } else {
            Write-Error "Certificate generation failed."
          }

